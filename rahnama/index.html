<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>راهنمای دانشجویان ورودی جدید</title>

<meta name="description" content="راهنمای دانشجویان ورودی جدید دانشگاه یزد">

<link rel="stylesheet" href="css/style.css">

<style>

body.intro-page{
min-height:100vh;
margin:0;
display:grid;
place-items:center;
padding:24px;
background:var(--bg);
color:var(--text);
}

/* container */

.hero-container{

width:min(860px,100%);
padding:36px;

border-radius:22px;

background:var(--card-bg);
border:1px solid var(--card-border);

box-shadow:
0 20px 40px rgba(0,0,0,.25);

backdrop-filter:blur(8px);
text-align:right;

}

/* typography */

h1{
margin-top:0;
margin-bottom:14px;
}

p{
line-height:1.9;
}

.credit{
opacity:.85;
margin-top:10px;
}

/* start button */

.btn-start{

display:inline-block;
margin-top:20px;

padding:14px 26px;

border-radius:14px;

border:1px solid var(--card-border);

background:var(--card-bg-hover);

color:var(--text);

text-decoration:none;

transition:.25s;
}

.btn-start:hover{
transform:translateY(-3px);
}

/* top bar */

.top-actions{

position:fixed;

top:18px;
left:18px;
right:18px;

display:flex;
justify-content:space-between;
align-items:center;

z-index:50;
}

/* back button */

.back-btn{

padding:10px 18px;

border-radius:10px;

background:var(--card-bg);

border:1px solid var(--card-border);

color:var(--text-muted);

text-decoration:none;

font-size:.9rem;

transition:.25s;

}

.back-btn:hover{

transform:translateX(6px);
color:var(--text);

}

/* theme toggle */

.theme-toggle{

display:flex;
align-items:center;
gap:8px;

padding:10px 14px;

border-radius:999px;

background:var(--card-bg);

border:1px solid var(--card-border);

cursor:pointer;

font-size:1rem;

}

.theme-toggle span{
pointer-events:none;
}

</style>

</head>

<body class="intro-page">


<div class="top-actions">

<a href="../index.html" class="back-btn">
← بازگشت
</a>

<button
class="theme-toggle"
onclick="toggleTheme()"
aria-label="تغییر تم"
>
<span>🌙</span>
<span>☀️</span>
</button>

</div>


<main class="hero-container premium-border">

<h1>به دانشگاه یزد خوش آمدید</h1>

<p>
این سامانه برای راهنمایی دانشجویان ورودی جدید طراحی شده
تا در ابتدای ورود به دانشگاه با بخش‌های مختلف آشنا شوید.
</p>

<p class="credit">
تهیه و تنظیم توسط
<strong>انجمن علمی نانو فناوری دانشگاه یزد</strong>
</p>

<a href="menu.html" class="btn-start">
ورود به راهنما
</a>

</main>


<script src="js/main.js" defer></script>

<script>

(function(){

const saved = localStorage.getItem("theme");

if(saved==="light"){
document.documentElement.setAttribute("data-theme","light");
}else{
document.documentElement.setAttribute("data-theme","dark");
}

})();

</script>


</body>
</html>
